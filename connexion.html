<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion / Inscription — ERS</title>
  <link rel="stylesheet" href="style2.css">
  <script src="controle.js" defer></script>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>ACCÈS MEMBRE</h2>
      <p>Connectez-vous ou créez votre compte ERS</p>
    </div>
    <div class="card-body">

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" id="tabConn" onclick="showTab('conn')">🔐 Connexion</button>
        <button class="tab-btn"        id="tabInsc" onclick="showTab('insc')">📝 Inscription</button>
      </div>

      <!-- ═══ FORMULAIRE CONNEXION ═══ -->
      <div id="panelConn">
        <form action="salle.php" method="post" onsubmit="return verifConnexion()">
          <input type="hidden" name="action" value="connexion">

          <div class="form-group">
            <label>Nom d'utilisateur</label>
            <input type="text" name="pseudo" id="cPseudo" placeholder="Votre pseudo">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" id="cEmail" placeholder="votre@email.com">
          </div>

          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="mdp" id="cMdp" placeholder="••••••••">
          </div>

          <div class="mt-20">
            <button type="submit" class="btn btn-primary">SE CONNECTER</button>
          </div>

          <p class="text-center mt-12 text-muted">
            Pas de compte ?
            <a class="link" onclick="showTab('insc')" style="cursor:pointer">S'inscrire</a>
          </p>
        </form>
      </div>

      <!-- ═══ FORMULAIRE INSCRIPTION ═══ -->
      <div id="panelInsc" style="display:none">
        <form action="salle.php" method="post" onsubmit="return verifInscription()">
          <input type="hidden" name="action" value="inscription">

          <div class="row">
            <div class="form-group">
              <label>Prénom</label>
              <input type="text" name="prenom" id="iPrenom" placeholder="Votre prénom">
            </div>
            <div class="form-group">
              <label>Nom</label>
              <input type="text" name="nom" id="iNom" placeholder="Votre nom">
            </div>
          </div>

          <div class="form-group">
            <label>Pseudo (5 à 10 caractères)</label>
            <input type="text" name="pseudo" id="x1" placeholder="pseudo unique">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" id="x2" placeholder="votre@email.com">
          </div>

          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="mdp" id="x22" placeholder="Majuscule + minuscule + chiffre">
          </div>

          <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <input type="password" name="mdp_confirm" id="x222" placeholder="Répétez le mot de passe">
          </div>

          <div class="mt-20">
            <button type="submit" class="btn btn-gold">CRÉER MON COMPTE</button>
          </div>

          <p class="text-center mt-12 text-muted">
            Déjà membre ?
            <a class="link" onclick="showTab('conn')" style="cursor:pointer">Se connecter</a>
          </p>
        </form>
      </div>

    </div>
  </div>

  <script>
    function showTab(tab) {
      document.getElementById('panelConn').style.display = tab === 'conn' ? '' : 'none';
      document.getElementById('panelInsc').style.display = tab === 'insc' ? '' : 'none';
      document.getElementById('tabConn').classList.toggle('active', tab === 'conn');
      document.getElementById('tabInsc').classList.toggle('active', tab === 'insc');
    }
  </script>
</body>
</html>
